<!doctype html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <title>Új jelszó – Értékelő</title>
</head>

<body>
  <div id="app">
    <main class="container">
      <section class="bal" aria-labelledby="page-title">
        <div class="sidebar__content__logo">
          <div class="logo" aria-hidden="true">É</div><span>értékelő</span>
        </div>
        <div class="title">
          <h1 id="page-title">Állítsd be az új jelszavad</h1>
        </div>
        <div class="text">
          <p>Add meg az emailben kapott helyreállító kódot, és írd be kétszer az új jelszavad.</p>
        </div>
      </section>
      <section class="jobb" aria-labelledby="reset-title">
        <div class="udv">
          <h2 id="reset-title">Új jelszó</h2>
          <p>A helyreállító kód 15 percig érvényes.</p>
        </div>
        <form id="recoverCompleteForm" data-api="/auth/recover/complete" data-success="A jelszavad frissült. Most már bejelentkezhetsz." data-reset-on-success>
          <div class="auth-field">
            <label for="recoverFinishEmail">Regisztrációs email</label>
            <input id="recoverFinishEmail" name="email" type="email" autocomplete="email" required placeholder="pelda@iskola.hu" />
          </div>
          <div class="auth-field">
            <label for="recoverToken">Emailben kapott 9 jegyű kód</label>
            <input id="recoverToken" name="token" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{9}" minlength="9" maxlength="9" required placeholder="9 jegyű kód" />
          </div>
          <div class="auth-field">
            <label for="recoverPassword">Új jelszó (8-72 karakter)</label>
            <div class="password-input-wrapper"><input id="recoverPassword" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required placeholder="Új jelszó" /><button class="password-toggle" type="button" aria-label="Jelszó megjelenítése" aria-controls="recoverPassword" aria-pressed="false" data-visible="false"><svg class="password-toggle__eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="password-toggle__eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/></svg></button></div>
          </div>
          <div class="auth-field">
            <label for="recoverPasswordConfirm">Új jelszó ismét</label>
            <div class="password-input-wrapper"><input id="recoverPasswordConfirm" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required placeholder="Írd be újra az új jelszót" /><button class="password-toggle" type="button" aria-label="Jelszó megjelenítése" aria-controls="recoverPasswordConfirm" aria-pressed="false" data-visible="false"><svg class="password-toggle__eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="password-toggle__eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/></svg></button></div>
          </div>
          <p class="auth-message" role="status" aria-live="polite"></p>
          <div class="auth-actions">
            <button class="auth-primary" type="submit">
              Jelszó visszaállítása <span aria-hidden="true">→</span>
            </button>
          </div>
        </form>
        <nav class="auth-links" aria-label="Jelszó-helyreállítási navigáció">
          <a href="./recover.html">Új helyreállító kód kérése</a>
          <a href="./index.html">Vissza a bejelentkezéshez</a>
        </nav>
      </section>
    </main>
    <footer>Értékelő 2026 · Tanári használatra</footer>
  </div>
  <script type="module" src="/src/js/script.js"></script>
</body>

</html>
