<!doctype html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <title>Regisztráció – Értékelő</title>
</head>

<body>
  <div id="app">
    <main class="container">
      <section class="bal" aria-labelledby="page-title">
        <div class="sidebar__content__logo">
          <div class="logo" aria-hidden="true">É</div><span>értékelő</span>
        </div>
        <div class="title">
          <h1 id="page-title">Hozz létre egy fiókot</h1>
        </div>
        <div class="text">
          <p>Regisztrálj, hogy egy helyen kezelhesd és értékelhesd a projekteket.</p>
        </div>
      </section>
      <section class="jobb" aria-labelledby="register-title">
        <div class="udv">
          <h2 id="register-title">Regisztráció</h2>
          <p>Add meg a fiók létrehozásához szükséges adatokat.</p>
        </div>
        <form id="registerForm" data-api="/auth/register" data-redirect="./projects.html">
          <div class="auth-field">
            <label for="registerUsername">Felhasználónév</label>
            <input id="registerUsername" name="username" type="text" autocomplete="username" minlength="3" maxlength="50" required placeholder="Felhasználónév" />
          </div>
          <div class="auth-field">
            <label for="registerEmail">Email</label>
            <input id="registerEmail" name="email"type="email" autocomplete="email" maxlength="254" required placeholder="pelda@iskola.hu" />
          </div>
          <div class="auth-field">
            <label for="registerPassword">Jelszó (8–72 karakter)</label>
            <div class="password-input-wrapper"><input id="registerPassword" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required placeholder="Válassz egy jelszót" /><button class="password-toggle" type="button" aria-label="Jelszó megjelenítése" aria-controls="registerPassword" aria-pressed="false" data-visible="false"><svg class="password-toggle__eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="password-toggle__eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/></svg></button></div>
          </div>
          <label class="checkbox"><input type="checkbox" required /><p>Elfogadom az <a href="/projekt-ertekelo/aszf.pdf" target="_blank">Általános Szerződési Feltételeket</a> (ÁSZF).</p></label>
          <label class="checkbox"><input type="checkbox" required /><p>Elfogadom az <a href="/projekt-ertekelo/at.pdf" target="_blank">Adatkezelési Tájékoztatót</a> (AT).</p></label>
          <p class="auth-message" role="status" aria-live="assertive"></p>
          <div class="auth-actions"><button class="auth-primary" type="submit">Regisztráció <span aria-hidden="true">→</span></button></div>
        </form>
        <nav class="auth-links" aria-label="Fiókműveletek">
          <a href="./index.html">Már van fiókod? Bejelentkezés</a>
        </nav>
      </section>
    </main>
    <footer>Értékelő 2026 · Tanári használatra</footer>
  </div>
  <script type="module" src="/src/js/script.js"></script>
</body>

</html>
