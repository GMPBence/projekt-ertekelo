<!doctype html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bejelentkezés</title>
</head>

<body>
  <div id="app">
    <div class="container">
      <div class="bal">
        <div class="sidebar__content__logo">
          <div class="logo">É</div>
          <h1>értékelő</h1>
        </div>
        <div class="title">
          <h1>Értékeld a projekteket egy helyen</h1>
        </div>
        <div class="text">
          <p>Letisztult tanári munkatér webfejlesztési projektek előnézetéhez, következetes értékeléséhez és
            lezárásához.</p>
        </div>
      </div>
      <div class="jobb">
        <div class="felso">
          <div class="udv">
            <h1>Üdv újra.</h1>
            <p>Jelentkezzen be a projektértékelő felületre!</p>
          </div>
          <div class="email">
            <p>Email vagy felhasználónév</p>
            <input type="email" placeholder="Email vagy felhasználónév" />
          </div>
          <div class="password">
            <p>Jelszó</p>
            <input type="password" placeholder="Jelszó" />
          </div>
        </div>
        <div class="login-button">
          <div class="checkbox">
            <input type="checkbox" id="remember-me" />
            <label for="remember-me">Emlékezz rám</label>
          </div>
          <button><img src="/arrow-right.png" alt=""> Belépés</button>
        </div>
        <div class="hibas">

        </div>
        <div class="folyamatban">

        </div>
      </div>
    </div>
    <footer>Értékelő 2026 Tanári használatra</footer>
  </div>

  <script type="module" src="/src/js/main.js"></script>
</body>

</html>
