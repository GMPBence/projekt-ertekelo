<!doctype html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <title>Jelszó-helyreállítás – Értékelő</title>
</head>

<body>
  <div id="app">
    <main class="container">
      <section class="bal" aria-labelledby="page-title">
        <div class="sidebar__content__logo">
          <div class="logo" aria-hidden="true">É</div><span>értékelő</span>
        </div>
        <div class="title">
          <h1 id="page-title">Állítsd vissza a jelszavad</h1>
        </div>
        <div class="text"><p>Kérj helyreállító kódot emailben, majd folytasd a jelszó visszaállítását.</p></div>
      </section>
      <section class="jobb" aria-labelledby="recover-title">
        <div class="udv">
          <h2 id="recover-title">Jelszó-helyreállítás</h2>
          <p>Emailben küldünk egy 15 percig érvényes helyreállító kódot.</p>
        </div>
        <form id="recoverForm" data-api="/auth/recover"
          data-success="Ha az email címhez tartozik fiók, elküldtük a 15 percig érvényes kódot."
          data-redirect="./recover-reset.html" data-redirect-email="email">
          <div class="auth-field"><label for="recoverEmail">Regisztrációs email</label><input id="recoverEmail"
              name="email" type="email" autocomplete="email" required placeholder="pelda@iskola.hu" /></div>
          <p class="auth-message" role="status" aria-live="polite"></p>
          <div class="auth-actions"><button class="auth-primary" type="submit">Helyreállító kód kérése <span
                aria-hidden="true">→</span></button></div>
        </form>
        <nav class="auth-links" aria-label="Fiókműveletek"><a href="./index.html">Vissza a bejelentkezéshez</a></nav>
      </section>
    </main>
    <footer>Értékelő 2026 · Tanári használatra</footer>
  </div>
  <script type="module" src="/src/js/script.js"></script>
</body>

</html>
